name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Skip detection for docs-only PR changes. WARNING: do NOT use GitHub's
  # native "[skip ci]" markers in commit messages — they cancel the whole
  # workflow, so required checks (test/db-integration/governance) never get
  # a check run and the PR hangs unmergeable. Automatic path detection only.
  # Skipped jobs still report success via step-level conditions so the
  # required checks never hang.
  check-skip:
    name: check-skip
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.detect.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect skip (PR changes in docs/org whitelist only)
        id: detect
        run: |
          set -euo pipefail
          skip=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            changed="$(git diff --name-only "$base"...HEAD || true)"
            only_docs=true
            for f in $changed; do
              case "$f" in
                doc/*|.claude/agents/*|.claude/rules/*) ;;
                */*) only_docs=false ;;  # any nested non-whitelisted path
                *.md) ;;                 # root-level markdown only
                *) only_docs=false ;;
              esac
            done
            if [ -n "$changed" ] && [ "$only_docs" = "true" ]; then
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "skip=$skip"

  governance:
    name: governance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Validate PR Driven-By field
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" | grep -qE "Driven-By|Source:"

  frontend:
    name: frontend
    needs: check-skip
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Skip (docs-only)
        if: needs.check-skip.outputs.skip == 'true'
        run: echo "CI skipped (docs-only change)"

      - name: Checkout
        if: needs.check-skip.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: needs.check-skip.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        if: needs.check-skip.outputs.skip != 'true'
        working-directory: web
        run: npm ci

      - name: Build frontend
        if: needs.check-skip.outputs.skip != 'true'
        working-directory: web
        run: npm run build

      - name: Check frontend types
        if: needs.check-skip.outputs.skip != 'true'
        working-directory: web
        run: npx tsc --noEmit

      - name: Run frontend tests
        if: needs.check-skip.outputs.skip != 'true'
        working-directory: web
        run: npm run test

      - name: Upload frontend dist
        if: needs.check-skip.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: internal/webui/web/dist
          if-no-files-found: error
          retention-days: 1

  test:
    name: test
    needs: [check-skip, frontend]
    if: always()  # check-skip failure fails open to full CI
    runs-on: ubuntu-24.04

    steps:
      - name: Skip (docs-only)
        if: needs.check-skip.outputs.skip == 'true'
        run: echo "CI skipped (docs-only change)"

      - name: Checkout
        if: needs.check-skip.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Download frontend dist
        if: needs.check-skip.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: internal/webui/web/dist

      - name: Setup Go
        if: needs.check-skip.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x" # go.mod requires go 1.24.4 (gofutuapi proto dep)
          cache: true

      - name: Verify module graph
        if: needs.check-skip.outputs.skip != 'true'
        run: |
          go mod tidy
          git diff --exit-code

      - name: Check gofmt
        if: needs.check-skip.outputs.skip != 'true'
        run: |
          files=$(git ls-files '*.go')
          if [ -n "$files" ]; then
            bad=$(gofmt -l $files)
            if [ -n "$bad" ]; then
              echo "gofmt needed on:"
              echo "$bad"
              exit 1
            fi
          fi

      - name: Run tests
        if: needs.check-skip.outputs.skip != 'true'
        run: go test ./... -count=1

      - name: Run vet
        if: needs.check-skip.outputs.skip != 'true'
        run: go vet ./...

      - name: Run race tests
        if: needs.check-skip.outputs.skip != 'true'
        run: go test -race ./... -count=1

      - name: Cross-compile release matrix
        if: needs.check-skip.outputs.skip != 'true'
        run: |
          for t in 'linux:amd64' 'linux:arm64' 'darwin:amd64' 'darwin:arm64' 'windows:amd64'; do
            goos=${t%%:*}; goarch=${t##*:}
            GOOS="$goos" GOARCH="$goarch" go build ./cmd/wbot ./internal/futu/
          done

      - name: Install staticcheck
        if: needs.check-skip.outputs.skip != 'true'
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        if: needs.check-skip.outputs.skip != 'true'
        run: |
          export PATH="${PATH}:$(go env GOPATH)/bin"
          staticcheck ./...

      - name: Verify binary and CLI smoke
        if: needs.check-skip.outputs.skip != 'true'
        run: |
          set -euo pipefail
          bin="$(mktemp)"
          tmp="$(mktemp -d)"
          trap 'rm -f "$bin"; rm -rf "$tmp"' EXIT
          go build -o "$bin" ./cmd/wbot
          "$bin" -version
          "$bin" master -duration 1ms 2>/dev/null
          "$bin" agent -duration 1ms -interval 1ms
          "$bin" paper -symbol V.US -side buy
          "$bin" serve -h >/dev/null 2>&1
          "$bin" backtest -h >/dev/null 2>&1
          "$bin" ingest mock -provider nope >/dev/null 2>&1 && exit 1 || true
          cp tools/config.yaml.example "$tmp/config.yaml"
          chmod 600 "$tmp/config.yaml"
          "$bin" configyaml -file "$tmp/config.yaml" >/dev/null

      # Self-contained acceptance scripts (no network, no DB, no gateway):
      # local e2e contract checks promoted to remote CI gate so the
      # "submit-time acceptance" rule has a remote backstop too.
      # 与 scripts/verify.sh 保持一致(2026-08-03)。
      - name: Run self-contained acceptance scripts
        if: needs.check-skip.outputs.skip != 'true'
        run: |
          set -euo pipefail
          scripts/accept-paper.sh
          scripts/accept-agent-federation.sh

  # PostgreSQL integration (Linux only; see internal/db WBOT_PG_DSN).
  db-integration:
    name: db-integration
    needs: [check-skip, frontend]
    if: always()  # check-skip failure fails open to full CI
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Skip (docs-only)
        if: needs.check-skip.outputs.skip == 'true'
        run: echo "CI skipped (docs-only change)"

      - name: Checkout
        if: needs.check-skip.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Download frontend dist
        if: needs.check-skip.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: internal/webui/web/dist

      - name: Setup Go
        if: needs.check-skip.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x" # go.mod requires go 1.24.4 (gofutuapi proto dep)
          cache: true

      - name: Verify module graph
        if: needs.check-skip.outputs.skip != 'true'
        run: |
          go mod tidy
          git diff --exit-code

      - name: Postgres migrations + ingest integration
        if: needs.check-skip.outputs.skip != 'true'
        env:
          WBOT_PG_DSN: postgres://postgres:postgres@localhost:5432/wbot_test?sslmode=disable
        # Serialize packages: all call MigrateUp against one DB; parallel packages can race on schema_migrations / DDL.
        run: go test ./internal/db/... ./internal/ingest/... ./internal/backtest/... ./internal/httpapi/... ./internal/wheelstore/... ./internal/wheelrun/... ./internal/watchlist/... ./internal/datacheck/... ./cmd/wbot/ -count=1 -race -p 1

      # Remote PG-backed acceptance: seed with local mock bars (same as
      # dev-up), start serve, run the backtest/watchlist/freshness accept
      # scripts. Seed is idempotent (ON CONFLICT upsert); backtest accept
      # uses BTEXEC.US, watchlist accept uses its own ACCEPT.US and cleans
      # up, freshness scripts use ACCOPT*/ACCCLUS* and clean up.
      # 2026-08-03: "submit-time acceptance" remote gate for PG-dependent
      # scripts (the zero-dependency pair runs in the test job instead).
      - name: Install postgresql-client (acceptance seeding)
        if: needs.check-skip.outputs.skip != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Remote PG-backed acceptance (backtest + watchlist + freshness)
        if: needs.check-skip.outputs.skip != 'true'
        env:
          WBOT_PG_DSN: postgres://postgres:postgres@localhost:5432/wbot_test?sslmode=disable
        run: |
          set -euo pipefail
          bin="$(mktemp)"
          trap 'kill "${serve_pid:-}" 2>/dev/null || true; rm -f "$bin"' EXIT
          go build -o "$bin" ./cmd/wbot
          scripts/seed-wheel-demo.sh "$bin" "$WBOT_PG_DSN" BTEXEC.US BTEXECB.US
          "$bin" serve -listen 127.0.0.1:8080 -dsn "$WBOT_PG_DSN" &
          serve_pid=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/v1/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/v1/health >/dev/null
          scripts/accept-backtest.sh http://127.0.0.1:8080 "$bin" "$WBOT_PG_DSN" BTEXEC.US
          scripts/accept-watchlist.sh "$bin" "$WBOT_PG_DSN" http://127.0.0.1:8080
          scripts/accept-wheel-audit.sh http://127.0.0.1:8080
          # Freshness gate on seeded data: mock bars (2024-06) are stale, so
          # the default-threshold run must exit 1 and -max-age must override.
          scripts/accept-option-freshness.sh "$bin" "$WBOT_PG_DSN"
          # Cluster options_freshness: seeds its own ACCCLUS* rows and
          # asserts fresh/stale statuses against the running serve.
          scripts/accept-options-cluster.sh http://127.0.0.1:8080 "$WBOT_PG_DSN"
          # Wheel live e2e: self-managed serve (random port) + fake Futu/LLM/Telegram.
          scripts/accept-wheel-live.sh "$bin" "$WBOT_PG_DSN"

  # Deterministic Markdown summary only (shell). No LLM APIs.
  ci-summary:
    name: ci-summary
    needs: [check-skip, test, db-integration]
    if: success()
    runs-on: ubuntu-24.04
    steps:
      - name: Write CI report to GitHub Step Summary
        env:
          GITHUB_SHA: ${{ github.sha }}
          SKIP: ${{ needs.check-skip.outputs.skip }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          {
            echo "## CI report"
            echo ""
            echo "Generated in-workflow by shell only (**no LLM**). The merge gate is the \`test\` job (go test, vet, gofmt, race, staticcheck, binary smoke) plus \`db-integration\` (Postgres + \`internal/db\`)."
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Repository | \`${{ github.repository }}\` |"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo "| Ref | \`${{ github.ref_name }}\` |"
            echo "| SHA | [\`${short_sha}\`](https://github.com/${{ github.repository }}/commit/${GITHUB_SHA}) |"
            echo "| Workflow run | [Open logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo "| CI skipped | \`$SKIP\` (docs-only change) |"
            echo ""
            echo "### Jobs"
            echo "- \`test\`: **ubuntu-24.04 (LTS)** — go test, vet, gofmt, race, staticcheck, binary smoke."
            echo "- \`db-integration\`: **ubuntu-24.04 (LTS)** + Postgres 16 — \`internal/db\` migrations + \`internal/ingest\` + \`internal/httpapi\` + \`cmd/wbot\` serve."
            echo "- \`governance\`: pull requests only — \`Driven-By\` field check."
          } >> "$GITHUB_STEP_SUMMARY"
