<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wbot · 策略</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<header>
  <h1>wbot</h1>
  <nav>
    <a href="/ui/">Dashboard</a>
    <a href="/ui/watchlist.html">策略</a>
    <a href="/ui/results.html">回测</a>
    <a href="/ui/data.html">数据</a>
    <a href="/ui/admin.html">Admin</a>
  </nav>
</header>
<main>
  <section id="strategies">
    <h2>策略说明</h2>
    <p class="notice">点击策略卡,可在下方表单中选中该策略并添加观察标的。</p>
    <p id="strategies-error" class="notice error" hidden></p>
    <div id="strategy-cards" class="strategy-cards"></div>
  </section>
  <section id="editor">
    <h2>编辑观察标的</h2>
    <form id="watchlist-form">
      <label>Symbol <input type="text" name="symbol" placeholder="HK.00700" required></label>
      <label>Strategy
        <select name="strategy" id="strategy-select" required></select>
      </label>
      <fieldset id="param-fields">
        <legend>Parameters</legend>
      </fieldset>
      <button type="submit">Save</button>
    </form>
    <p id="watchlist-form-error" class="notice error" hidden></p>
  </section>
  <section id="list">
    <h2>观察列表</h2>
    <p id="watchlist-error" class="notice error" hidden></p>
    <p id="watchlist-empty" class="notice" hidden>No symbols on the watchlist.</p>
    <div class="table-scroll">
      <table id="watchlist-table" hidden>
        <thead>
          <tr><th>Symbol</th><th>Strategy</th><th>Params</th><th>Updated at</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>
<script src="/ui/app.js"></script>
</body>
</html>
