    <path d="M16 25 V11"/>
    <rect x="14" y="13" width="4" height="6" rx="1" fill="#ffffff" stroke="none"/>
    <path d="M23 21 V7"/>
    <rect x="21" y="9" width="4" height="4" rx="1" fill="#ffffff" stroke="none"/>
  </g>
</svg>
