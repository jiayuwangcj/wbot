<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wbot · Admin</title>
<link rel="icon" href="/ui/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<header>
  <h1>wbot</h1>
  <nav>
    <a href="/ui/">Dashboard</a>
    <a href="/ui/watchlist.html">策略</a>
    <a href="/ui/results.html">回测</a>
    <a href="/ui/data.html">数据</a>
    <a href="/ui/admin.html">Admin</a>
  </nav>
  <button type="button" id="theme-toggle" class="ghost" title="切换深浅色主题" aria-label="切换深浅色主题">🌙</button>
</header>
<main class="full">
  <section id="cluster">
    <h2>集群节点状态</h2>
    <p class="notice">serve 进程 / PostgreSQL / 行情管道 / 数据平面 各节点总览;详细 bars 覆盖见「数据」页。</p>
    <button type="button" id="admin-refresh" class="ghost">刷新</button>
    <span id="admin-updated" class="muted"></span>
    <p id="cluster-error" class="notice error" hidden></p>
    <div id="cluster-cards" class="node-grid" hidden>
      <article class="node-card">
        <h3><span id="cluster-process-badge" class="badge"></span> 进程</h3>
        <dl>
          <dt>版本</dt><dd id="cluster-process-version"></dd>
          <dt>PID</dt><dd id="cluster-process-pid"></dd>
          <dt>运行时长</dt><dd id="cluster-process-uptime"></dd>
          <dt>监听地址</dt><dd id="cluster-process-listen"></dd>
        </dl>
      </article>
      <article class="node-card">
        <h3><span id="cluster-db-badge" class="badge"></span> 数据库</h3>
        <dl>
          <dt>状态</dt><dd id="cluster-db-state"></dd>
          <dt>延迟</dt><dd id="cluster-db-latency"></dd>
        </dl>
      </article>
      <article class="node-card">
        <h3><span id="cluster-pipeline-badge" class="badge"></span> 数据管道</h3>
        <dl>
          <dt>运行中</dt><dd id="cluster-pipeline-running"></dd>
          <dt>成功</dt><dd id="cluster-pipeline-succeeded"></dd>
          <dt>失败</dt><dd id="cluster-pipeline-failed"></dd>
        </dl>
      </article>
      <article class="node-card">
        <h3><span id="cluster-data-badge" class="badge"></span> 数据平面</h3>
        <dl>
          <dt>缓存序列</dt><dd id="cluster-data-series"></dd>
          <dt>过期序列</dt><dd id="cluster-data-stale"></dd>
          <dt>最新 K 线</dt><dd id="cluster-data-newest"></dd>
        </dl>
      </article>
    </div>
  </section>
  <section id="config">
    <h2>配置</h2>
    <p class="notice">仅元数据:配置值只写不读——设置时输入,永不展示/回显(凭证、监听地址)。</p>
    <p id="config-error" class="notice error" hidden></p>
    <p id="config-empty" class="notice" hidden>无配置键。</p>
    <form id="config-set-form" hidden>
      <label>键
        <select id="config-set-key"></select>
      </label>
      <label>值
        <input id="config-set-value" autocomplete="off" placeholder="仅写入,不会回显">
      </label>
      <button type="submit" id="config-set-btn">设置</button>
      <span id="config-set-ok" class="notice" hidden>已保存。</span>
    </form>
    <div class="table-scroll">
      <table id="config-table" hidden>
        <thead>
          <tr><th>键</th><th>分组</th><th>已设置</th><th>更新时间</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>
<script src="/ui/app.js"></script>
</body>
</html>
