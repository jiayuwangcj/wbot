<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wbot · Dashboard</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<header>
  <h1>wbot</h1>
  <nav>
    <a href="/ui/">Dashboard</a>
    <a href="/ui/watchlist.html">策略</a>
    <a href="/ui/results.html">回测</a>
    <a href="/ui/data.html">数据</a>
    <a href="/ui/admin.html">Admin</a>
  </nav>
  <button type="button" id="theme-toggle" class="ghost" title="切换深浅色主题" aria-label="切换深浅色主题">🌙</button>
</header>
<main>
  <div class="env-bar">
    <div class="env-toggle" role="group" aria-label="交易环境">
      <button type="button" id="env-paper" class="env-btn active">Paper 模拟盘</button>
      <button type="button" id="env-real" class="env-btn">实盘 Live</button>
    </div>
    <span id="env-badge" class="env-badge paper">PAPER · 模拟盘</span>
    <button type="button" id="dash-refresh" class="ghost">刷新</button>
    <span id="dash-updated" class="muted"></span>
  </div>

  <p id="dash-error" class="notice error" hidden></p>

  <div class="dash-grid">
    <div class="dash-main">
      <section id="summary">
        <h2>账户资产 <span id="summary-env" class="section-tag">模拟盘</span></h2>
        <p id="summary-error" class="notice error" hidden></p>
        <div class="metric-grid" id="summary-cards" hidden>
          <div class="metric-card"><h3>总资产</h3><p id="summary-total-assets" class="metric-value">—</p></div>
          <div class="metric-card"><h3>现金</h3><p id="summary-cash" class="metric-value">—</p></div>
          <div class="metric-card"><h3>证券市值</h3><p id="summary-market-val" class="metric-value">—</p></div>
          <div class="metric-card"><h3>购买力</h3><p id="summary-power" class="metric-value">—</p></div>
          <div class="metric-card"><h3>可用资金</h3><p id="summary-available-cash" class="metric-value">—</p></div>
        </div>
      </section>

      <section id="accounts">
        <h2>子账户明细</h2>
        <p id="accounts-error" class="notice error" hidden></p>
        <p id="accounts-empty" class="notice" hidden>暂无账户数据。</p>
        <div class="table-scroll">
          <table id="accounts-table" hidden>
            <thead>
              <tr><th>环境</th><th>账户 ID</th><th>总资产</th><th>现金</th><th>市值</th><th>可用资金</th><th>购买力</th><th>持仓</th><th>状态</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section id="positions">
        <h2>持仓 <span id="positions-env" class="section-tag">模拟盘</span></h2>
        <p id="positions-error" class="notice error" hidden></p>
        <p id="positions-empty" class="notice" hidden>当前环境无持仓。</p>
        <div class="table-scroll">
          <table id="positions-table" hidden>
            <thead>
              <tr><th data-sort="symbol" title="点击按此列排序">代码</th><th data-sort="qty" title="点击按此列排序">数量</th><th data-sort="avg_cost" title="点击按此列排序">成本价</th><th data-sort="price" title="点击按此列排序">现价</th><th data-sort="market_val" title="点击按此列排序">市值</th><th data-sort="pl" title="点击按此列排序">盈亏</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </div>

    <aside class="dash-side">
      <section id="orders">
        <h2>当前订单 <span id="orders-env" class="section-tag">模拟盘</span></h2>
        <p class="notice">挂单列表（read-only, /v1/futu/orders;模拟盘默认）。</p>
        <p id="orders-error" class="notice error" hidden></p>
        <p id="orders-empty" class="notice" hidden>暂无挂单。</p>
        <div class="table-scroll">
          <table id="orders-table" hidden>
            <thead>
              <tr><th data-sort="create_time" title="点击按此列排序">时间</th><th data-sort="symbol" title="点击按此列排序">代码</th><th data-sort="side" title="点击按此列排序">方向</th><th data-sort="status" title="点击按此列排序">状态</th><th data-sort="qty" title="点击按此列排序">数量</th><th data-sort="price" title="点击按此列排序">价格</th><th data-sort="fill_qty" title="点击按此列排序">已成交</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </aside>
  </div>

  <section id="runs">
    <h2>最近入库</h2>
    <p id="runs-error" class="notice error" hidden></p>
    <p id="runs-empty" class="notice" hidden>尚无入库记录。</p>
    <div class="table-scroll">
      <table id="runs-table" hidden>
        <thead>
          <tr><th>ID</th><th>来源</th><th>状态</th><th>开始</th><th>结束</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>
<script src="/ui/app.js"></script>
</body>
</html>
